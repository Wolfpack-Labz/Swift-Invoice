<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://*.supabase.co https://*.supabase.net; style-src 'unsafe-inline'; script-src 'self'; img-src 'self' data:; frame-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none';" />
  <title>Opening ProofPack…</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; background: #f1f5f9; color: #0f172a; }
    .card { width: min(560px, 100%); background: white; border: 1px solid #dbe3ef; border-radius: 22px; padding: 30px; box-shadow: 0 24px 70px rgba(15, 23, 42, .12); text-align: center; }
    .mark { width: 62px; height: 62px; margin: 0 auto 18px; border-radius: 18px; display: grid; place-items: center; background: #17223f; color: white; font-weight: 900; font-size: 26px; }
    h1 { margin: 0 0 10px; font-size: 26px; }
    p { margin: 0; color: #64748b; line-height: 1.6; }
    .spinner { width: 34px; height: 34px; margin: 24px auto 0; border: 4px solid #dbe3ef; border-top-color: #2563eb; border-radius: 50%; animation: spin .8s linear infinite; }
    .error { display: none; }
    .error h1 { color: #991b1b; }
    .viewer-shell { display: none; position: fixed; inset: 0; background: #e2e8f0; }
    .viewer-toolbar { position: fixed; z-index: 2; top: max(12px, env(safe-area-inset-top)); right: 14px; display: flex; gap: 10px; }
    .viewer-toolbar button { appearance: none; border: 0; border-radius: 999px; padding: 12px 18px; background: #17223f; color: white; font: inherit; font-weight: 800; box-shadow: 0 10px 30px rgba(15, 23, 42, .22); }
    .viewer-frame { width: 100%; height: 100%; border: 0; background: white; }
    @media print { .viewer-toolbar { display: none; } }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="card" id="loading">
    <div class="mark">QP</div>
    <h1>Opening your ProofPack</h1>
    <p>Loading the professional record for this completed job.</p>
    <div class="spinner" aria-label="Loading"></div>
  </main>
  <main class="card error" id="error" role="alert">
    <div class="mark">!</div>
    <h1>ProofPack unavailable</h1>
    <p id="error-message">This package could not be opened.</p>
  </main>
  <section class="viewer-shell" id="viewer-shell">
    <div class="viewer-toolbar"><button type="button" id="print-button">Print / Save as PDF</button></div>
    <iframe class="viewer-frame" id="viewer-frame" title="ProofPack job completion package" sandbox="allow-same-origin"></iframe>
  </section>
  <script src="./proofpack-viewer.js" defer></script>
</body>
</html>
