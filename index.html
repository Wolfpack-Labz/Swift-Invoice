<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swift Invoice — Legal &amp; Policies</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a73e8;
      color: #fff;
      padding: 2rem 1.5rem 1.5rem;
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header p {
      margin-top: 0.5rem;
      font-size: 1rem;
      opacity: 0.85;
    }

    main {
      max-width: 760px;
      width: 100%;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
      flex: 1;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #666;
      margin-bottom: 0.75rem;
    }

    .card-list {
      list-style: none;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow: hidden;
      margin-bottom: 2rem;
    }

    .card-list li {
      border-bottom: 1px solid #f0f0f0;
    }

    .card-list li:last-child {
      border-bottom: none;
    }

    .card-list a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s;
    }

    .card-list a:hover {
      background: #f0f6ff;
    }

    .card-list .item-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .card-list .icon {
      font-size: 1.5rem;
      width: 2.25rem;
      text-align: center;
    }

    .card-list .label {
      font-size: 1rem;
      font-weight: 500;
    }

    .card-list .desc {
      font-size: 0.8rem;
      color: #888;
      margin-top: 2px;
    }

    .card-list .chevron {
      color: #bbb;
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.8rem;
      color: #aaa;
      border-top: 1px solid #e8e8e8;
      background: #fff;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ Swift Invoice</h1>
    <p>Legal documents, policies, and terms for our app</p>
  </header>

  <main>
    <p class="section-title">Documents</p>
    <ul class="card-list">

      <li>
        <a href="privacy-policy.html">
          <span class="item-info">
            <span class="icon">🔒</span>
            <span>
              <div class="label">Privacy Policy</div>
              <div class="desc">How we collect, use, and protect your data</div>
            </span>
          </span>
          <span class="chevron">›</span>
        </a>
      </li>

      <li>
        <a href="terms-and-conditions.html">
          <span class="item-info">
            <span class="icon">📄</span>
            <span>
              <div class="label">Terms &amp; Conditions</div>
              <div class="desc">Rules and guidelines for using Swift Invoice</div>
            </span>
          </span>
          <span class="chevron">›</span>
        </a>
      </li>

    </ul>
  </main>

  <footer>
    &copy; <span id="year"></span> Wolfpack Labz. All rights reserved.
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
