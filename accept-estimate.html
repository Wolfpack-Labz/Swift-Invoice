<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Respond to Estimate | Wolfpack Labz</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f4f6;
        color: #111827;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: 100%;
        max-width: 620px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 18px;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
        padding: 28px;
      }

      .eyebrow {
        color: #6b7280;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 28px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 16px;
        color: #4b5563;
        line-height: 1.6;
      }

      .summary {
        margin: 20px 0;
        padding: 16px;
        border-radius: 14px;
        background: #f9fafb;
        border: 1px solid #e5e7eb;
      }

      .row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 8px 0;
        border-bottom: 1px solid #e5e7eb;
      }

      .row:last-child {
        border-bottom: 0;
      }

      .label {
        color: #6b7280;
      }

      .value {
        color: #111827;
        font-weight: 700;
        text-align: right;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 20px;
      }

      button {
        border: 0;
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }

      .accept {
        background: #111827;
        color: #ffffff;
      }

      .decline {
        background: #ffffff;
        color: #991b1b;
        border: 1px solid #991b1b;
      }

      .message {
        margin-top: 18px;
        padding: 14px;
        border-radius: 12px;
        line-height: 1.5;
      }

      .info {
        background: #eff6ff;
        color: #1e40af;
      }

      .success {
        background: #ecfdf5;
        color: #047857;
      }

      .error {
        background: #fef2f2;
        color: #991b1b;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 560px) {
        body {
          align-items: flex-start;
          padding: 16px;
        }

        .card {
          padding: 22px;
        }

        .actions {
          grid-template-columns: 1fr;
        }

        .row {
          display: block;
        }

        .value {
          display: block;
          margin-top: 4px;
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">Wolfpack Labz</div>
      <h1>Estimate Response</h1>
      <p id="intro">Loading estimate details...</p>

      <section id="summary" class="summary hidden" aria-label="Estimate summary">
        <div class="row">
          <span class="label">Estimate</span>
          <span id="estimateNumber" class="value">—</span>
        </div>
        <div class="row">
          <span class="label">Customer</span>
          <span id="customerName" class="value">—</span>
        </div>
        <div class="row">
          <span class="label">Estimated total</span>
          <span id="estimateTotal" class="value">—</span>
        </div>
        <div class="row">
          <span class="label">Status</span>
          <span id="estimateStatus" class="value">—</span>
        </div>
      </section>

      <section id="actions" class="actions hidden" aria-label="Estimate response actions">
        <button id="acceptButton" class="accept" type="button">Accept Estimate</button>
        <button id="declineButton" class="decline" type="button">Decline Estimate</button>
      </section>

      <div id="message" class="message info">Please wait while we load the estimate.</div>
    </main>

    <script>
      const SUPABASE_URL = 'https://gwmckwqxnrnzqmhvodgm.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable__tJuY11O2GoJ3dn3SPLtgA_MXh_mPCf';

      const params = new URLSearchParams(window.location.search);
      const token = params.get('token') || '';
      const estimateId = params.get('estimate_id') || params.get('id') || '';

      const intro = document.getElementById('intro');
      const summary = document.getElementById('summary');
      const actions = document.getElementById('actions');
      const message = document.getElementById('message');
      const acceptButton = document.getElementById('acceptButton');
      const declineButton = document.getElementById('declineButton');

      function setMessage(text, type = 'info') {
        message.textContent = text;
        message.className = `message ${type}`;
      }

      function setBusy(isBusy) {
        acceptButton.disabled = isBusy;
        declineButton.disabled = isBusy;
      }

      function formatMoney(value) {
        const amount = Number(value || 0);
        return amount.toLocaleString(undefined, {
          style: 'currency',
          currency: 'USD',
        });
      }

      async function callRpc(functionName, body) {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${functionName}`, {
          method: 'POST',
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(body),
        });

        const text = await response.text();
        let data = null;

        try {
          data = text ? JSON.parse(text) : null;
        } catch (error) {
          throw new Error(text || 'Unexpected server response.');
        }

        if (!response.ok) {
          throw new Error(data?.message || data?.error || 'Request failed.');
        }

        return data;
      }

      async function loadEstimate() {
        if (!token && !estimateId) {
          intro.textContent = 'This response link is missing its estimate identifier.';
          setMessage('Please ask the sender for a new estimate link.', 'error');
          return;
        }

        try {
          const result = await callRpc('get_estimate_response_details', {
            p_token: token,
            p_estimate_id: estimateId,
          });

          if (!result?.ok) {
            intro.textContent = 'We could not load this estimate.';
            setMessage(result?.message || 'This estimate link is invalid or expired.', 'error');
            return;
          }

          document.getElementById('estimateNumber').textContent = `#${result.estimate_number}`;
          document.getElementById('customerName').textContent = result.customer_name || 'Customer';
          document.getElementById('estimateTotal').textContent = formatMoney(result.total);
          document.getElementById('estimateStatus').textContent = result.status || 'sent';

          intro.textContent = 'Review the estimate response options below.';
          summary.classList.remove('hidden');

          if (result.can_respond) {
            actions.classList.remove('hidden');
            setMessage('Choose Accept Estimate or Decline Estimate below.', 'info');
          } else {
            setMessage(result.message || 'This estimate has already been responded to.', 'success');
          }
        } catch (error) {
          intro.textContent = 'Load failed.';
          setMessage(error.message || 'Unable to load the estimate. Please try again later.', 'error');
        }
      }

      async function respond(action) {
        const label = action === 'accept' ? 'accept' : 'decline';
        const confirmed = window.confirm(`Are you sure you want to ${label} this estimate?`);

        if (!confirmed) {
          return;
        }

        try {
          setBusy(true);
          setMessage('Saving your response...', 'info');

          const result = await callRpc('respond_to_estimate', {
            p_token: token,
            p_estimate_id: estimateId,
            p_action: action,
          });

          if (!result?.ok) {
            throw new Error(result?.message || 'Response could not be saved.');
          }

          actions.classList.add('hidden');
          document.getElementById('estimateStatus').textContent = result.status;
          setMessage(result.message || 'Your response was saved.', 'success');
        } catch (error) {
          setMessage(error.message || 'Response failed. Please try again later.', 'error');
        } finally {
          setBusy(false);
        }
      }

      acceptButton.addEventListener('click', () => respond('accept'));
      declineButton.addEventListener('click', () => respond('decline'));

      loadEstimate();
    </script>
  </body>
</html>
