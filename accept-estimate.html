<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Respond to Estimate | Wolfpack Labz</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f4f6;
        --card: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --soft: #f9fafb;
        --primary: #111827;
        --danger: #991b1b;
        --success-bg: #ecfdf5;
        --success-text: #047857;
        --info-bg: #eff6ff;
        --info-text: #1e40af;
        --error-bg: #fef2f2;
        --error-text: #991b1b;
        font-family: Arial, Helvetica, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(17, 24, 39, 0.08), transparent 30%),
          var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      main {
        width: 100%;
        max-width: 680px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.1);
        padding: 30px;
      }

      .brand {
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 30px;
        line-height: 1.15;
      }

      p {
        margin: 0 0 16px;
        color: #4b5563;
        line-height: 1.6;
      }

      .summary {
        margin: 22px 0;
        padding: 16px;
        border-radius: 16px;
        background: var(--soft);
        border: 1px solid var(--border);
      }

      .row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }

      .row:last-child {
        border-bottom: 0;
      }

      .label {
        color: var(--muted);
      }

      .value {
        color: var(--text);
        font-weight: 800;
        text-align: right;
        overflow-wrap: anywhere;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 20px;
      }

      button {
        border: 0;
        border-radius: 14px;
        padding: 15px 16px;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.12s ease, opacity 0.12s ease;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }

      .accept {
        background: var(--primary);
        color: #ffffff;
      }

      .decline {
        background: #ffffff;
        color: var(--danger);
        border: 1px solid var(--danger);
      }

      .message {
        margin-top: 18px;
        padding: 14px;
        border-radius: 14px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      .info {
        background: var(--info-bg);
        color: var(--info-text);
      }

      .success {
        background: var(--success-bg);
        color: var(--success-text);
      }

      .error {
        background: var(--error-bg);
        color: var(--error-text);
      }

      .debug {
        margin-top: 14px;
        font-size: 13px;
        color: var(--muted);
      }

      .debug code {
        display: block;
        margin-top: 6px;
        padding: 10px;
        border-radius: 10px;
        background: #f3f4f6;
        color: #374151;
        overflow-wrap: anywhere;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 560px) {
        body {
          align-items: flex-start;
          padding: 16px;
        }

        .card {
          padding: 22px;
        }

        h1 {
          font-size: 26px;
        }

        .actions {
          grid-template-columns: 1fr;
        }

        .row {
          display: block;
        }

        .value {
          display: block;
          margin-top: 4px;
          text-align: left;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <section class="card" aria-live="polite">
        <div class="brand">Wolfpack Labz</div>
        <h1>Estimate Response</h1>
        <p id="intro">Loading estimate details...</p>

        <section id="summary" class="summary hidden" aria-label="Estimate summary">
          <div class="row">
            <span class="label">Estimate</span>
            <span id="estimateNumber" class="value">—</span>
          </div>
          <div class="row">
            <span class="label">Customer</span>
            <span id="customerName" class="value">—</span>
          </div>
          <div class="row">
            <span class="label">Business</span>
            <span id="businessName" class="value">—</span>
          </div>
          <div class="row">
            <span class="label">Estimated total</span>
            <span id="estimateTotal" class="value">—</span>
          </div>
          <div class="row">
            <span class="label">Status</span>
            <span id="estimateStatus" class="value">—</span>
          </div>
        </section>

        <section id="actions" class="actions hidden" aria-label="Estimate response actions">
          <button id="acceptButton" class="accept" type="button">Accept Estimate</button>
          <button id="declineButton" class="decline" type="button">Decline Estimate</button>
        </section>

        <div id="message" class="message info">Please wait while we load the estimate.</div>

        <details id="debug" class="debug hidden">
          <summary>Troubleshooting details</summary>
          <code id="debugText"></code>
        </details>
      </section>
    </main>

    <script>
      // These values must match the same Supabase project used by your app.
      const SUPABASE_URL = 'https://gwmckwqxnrnzqmhvodgm.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable__tJuY11O2GoJ3dn3SPLtgA_MXh_mPCf';

      const $ = (id) => document.getElementById(id);

      const intro = $('intro');
      const summary = $('summary');
      const actions = $('actions');
      const message = $('message');
      const acceptButton = $('acceptButton');
      const declineButton = $('declineButton');
      const debug = $('debug');
      const debugText = $('debugText');

      function cleanParam(value) {
        if (!value) return null;
        const cleaned = String(value).trim();
        if (!cleaned || cleaned === 'null' || cleaned === 'undefined') return null;
        return cleaned;
      }

      function getQueryValue(names) {
        const params = new URLSearchParams(window.location.search);

        for (const name of names) {
          const value = cleanParam(params.get(name));
          if (value) return value;
        }

        // Some PDFs/email clients can encode & as &amp;, creating keys like amp;estimate_id.
        for (const name of names) {
          const value = cleanParam(params.get(`amp;${name}`));
          if (value) return value;
        }

        return null;
      }

      function isUuid(value) {
        return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(value || '');
      }

      const token = getQueryValue(['token', 'acceptance_token', 'acceptanceToken', 't']);
      const responseCode = getQueryValue(['e', 'code', 'response_code', 'responseCode']);
      const rawEstimateId = getQueryValue(['estimate_id', 'estimateId', 'estimate', 'id']);
      const estimateId = isUuid(rawEstimateId) ? rawEstimateId : null;

      function setMessage(text, type = 'info') {
        message.textContent = text;
        message.className = `message ${type}`;
      }

      function showDebug(extra = {}) {
        const details = {
          page_url: window.location.href,
          token_present: Boolean(token),
          token_preview: token ? `${token.slice(0, 8)}...` : null,
          response_code: responseCode,
          raw_estimate_id: rawEstimateId,
          estimate_id_used: estimateId,
          supabase_url: SUPABASE_URL,
          ...extra,
        };

        debugText.textContent = JSON.stringify(details, null, 2);
        debug.classList.remove('hidden');
      }

      function setBusy(isBusy) {
        acceptButton.disabled = isBusy;
        declineButton.disabled = isBusy;
      }

      function formatMoney(value) {
        const amount = Number(value || 0);
        return amount.toLocaleString(undefined, {
          style: 'currency',
          currency: 'USD',
        });
      }

      function formatStatus(value) {
        if (!value) return 'Sent';
        return String(value).charAt(0).toUpperCase() + String(value).slice(1);
      }

      async function callRpc(functionName, body) {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${functionName}`, {
          method: 'POST',
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(body),
        });

        const rawText = await response.text();
        let data = null;

        try {
          data = rawText ? JSON.parse(rawText) : null;
        } catch (_error) {
          throw new Error(rawText || 'Supabase returned an unreadable response.');
        }

        if (!response.ok) {
          const message = data?.message || data?.error || data?.hint || data?.details || 'Supabase request failed.';
          throw new Error(message);
        }

        return Array.isArray(data) ? data[0] : data;
      }

      function fillEstimate(result) {
        const estimate = result.estimate || result;
        const customer = result.customer || {};
        const business = result.business || {};

        $('estimateNumber').textContent = estimate.estimate_number ? `#${estimate.estimate_number}` : '—';
        $('customerName').textContent = result.customer_name || customer.name || 'Customer';
        $('businessName').textContent = result.business_name || business.business_name || 'Wolfpack Labz';
        $('estimateTotal').textContent = formatMoney(estimate.total || result.total);
        $('estimateStatus').textContent = formatStatus(estimate.status || result.status || 'sent');
      }

      async function loadEstimate() {
        if (!token && !estimateId && !responseCode) {
          intro.textContent = 'This response link is missing its estimate information.';
          setMessage('Please ask the sender for a new estimate link.', 'error');
          showDebug({ reason: 'missing_token_response_code_and_estimate_id' });
          return;
        }

        if (rawEstimateId && !estimateId) {
          setMessage('This link contains an invalid estimate ID. Trying the token instead...', 'info');
        }

        try {
          const result = await callRpc('get_estimate_response_details', {
            p_estimate_id: estimateId,
            p_token: token,
            p_response_code: responseCode,
          });

          if (!result || result.ok !== true) {
            intro.textContent = 'We could not load this estimate.';
            setMessage(result?.message || 'Estimate not found. Please ask the sender for a new link.', 'error');
            showDebug({ rpc_result: result || null });
            return;
          }

          fillEstimate(result);
          intro.textContent = 'Ready to move forward? Choose an option below.';
          summary.classList.remove('hidden');

          if (result.can_respond === true) {
            actions.classList.remove('hidden');
            setMessage('You can accept or decline this estimate below.', 'info');
          } else {
            actions.classList.add('hidden');
            setMessage(result.message || `This estimate is already marked as ${formatStatus(result.status)}.`, 'success');
          }
        } catch (error) {
          intro.textContent = 'Load failed.';
          setMessage(error.message || 'Unable to load the estimate. Please try again later.', 'error');
          showDebug({ caught_error: error.message || String(error) });
        }
      }

      async function respond(responseStatus) {
        const label = responseStatus === 'accepted' ? 'accept' : 'decline';
        const confirmed = window.confirm(`Are you sure you want to ${label} this estimate?`);
        if (!confirmed) return;

        try {
          setBusy(true);
          setMessage('Saving your response...', 'info');

          const result = await callRpc('respond_to_estimate', {
            p_estimate_id: estimateId,
            p_token: token,
            p_response_code: responseCode,
            p_response: responseStatus,
          });

          if (!result || result.ok !== true) {
            throw new Error(result?.message || 'Your response could not be saved.');
          }

          actions.classList.add('hidden');
          $('estimateStatus').textContent = formatStatus(result.status);
          setMessage(result.message || 'Your response was saved.', 'success');
        } catch (error) {
          setMessage(error.message || 'Response failed. Please try again later.', 'error');
          showDebug({ caught_error: error.message || String(error) });
        } finally {
          setBusy(false);
        }
      }

      acceptButton.addEventListener('click', () => respond('accepted'));
      declineButton.addEventListener('click', () => respond('declined'));

      loadEstimate();
    </script>
  </body>
</html>
